# Second Railway service, same repo, different start command.
# Point the `worker` service at this file (Settings -> Config-as-code path).
#
# The worker holds the APScheduler cron. If you would rather use Railway's
# native cron, set the service's start command to
#   python -m src.scheduler --once
# and schedule it at "0 10 * * 1-5" (06:00 America/New_York in winter,
# 05:00 in summer -- Railway cron is UTC, APScheduler is not, which is the
# reason this file defaults to the in-process scheduler).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.scheduler"
restartPolicyType = "ALWAYS"
