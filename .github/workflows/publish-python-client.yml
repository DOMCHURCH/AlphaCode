# Publishes clients/python to PyPI as `balanceproof`.
#
# Trusted publishing (OIDC): no token is stored anywhere. PyPI trusts this
# exact repo + workflow file + `pypi` environment. Runs only when a tag like
# `pyclient-v0.1.0` is pushed; the tag's version must match pyproject.toml.
name: Publish Python client

on:
  push:
    tags: ["pyclient-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        working-directory: clients/python
        run: |
          want="${GITHUB_REF_NAME#pyclient-v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$have" || { echo "tag $want != pyproject $have"; exit 1; }
      - name: Build
        working-directory: clients/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
