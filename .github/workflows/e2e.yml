name: e2e

# The browser tests. Separate from pytest on purpose: this one needs Node and
# a Chromium download, and pinning that to every Python run would make the
# fast suite slow for the sake of one directory.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the app
        run: pip install -r requirements.txt

      - name: Install the test runner
        working-directory: e2e
        # `npm ci` and not `npm install`: the lockfile is committed so this
        # run uses the Playwright the suite was written against, rather than
        # whatever shipped this morning.
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        # Only the one browser. The suite declares a single chromium project,
        # and downloading Firefox and WebKit to not use them costs a minute of
        # every run.
        run: npx playwright install --with-deps chromium

      - name: Run
        working-directory: e2e
        # Playwright starts uvicorn itself against a throwaway SQLite file.
        # No secrets are needed and none are provided: this flow touches
        # neither Stripe nor SEC, and the mailer has no key so it cannot dial
        # out even if something tried.
        run: npx playwright test

      - name: Upload the report
        # Kept only when something failed. A green run's report is noise, and
        # a failed run's is the trace you actually need to read.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
