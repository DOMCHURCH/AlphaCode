# Single-service deploy (the simple default): one service runs both the API and
# the daily funnel cron. Set ENABLE_SCHEDULER=true in the service's variables and
# that's the whole app -- no separate worker. (To split into api + worker later,
# point a second service at railway.worker.toml and leave ENABLE_SCHEDULER off
# here.)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn src.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
