<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To Scale — backdrop preview</title>
<!--
  A harmless preview of the backdrop, served by the existing /static mount so
  it needs no route and touches no page. Open it at:

      http://127.0.0.1:8000/static/media/preview.html

  Delete this file whenever the real dark pages exist; nothing imports it.

  The cards below are a first sketch of the glass-over-dark treatment, here to
  prove the veil actually keeps text readable over a moving image. The real
  redesign is a separate piece of work.
-->
<link rel="stylesheet" href="/static/backdrop.css">
<style>
  :root { --gold: #f0a500; --surface: #1a1a1a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #f4f1ea;
    font: 16px/1.6 "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 28px;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { font-size: clamp(30px, 7vw, 46px); line-height: 1.05; margin: 0 0 12px;
       font-weight: 600; letter-spacing: -0.02em; }
  .lede { color: #b8b0a4; margin: 0 0 26px; max-width: 46ch; }
  .gold { color: var(--gold); }

  /* Glass over the film, with a soft inner light at the top edge so the card
     reads as lit from above rather than as a flat grey box. */
  .card {
    background: linear-gradient(160deg, rgba(40,36,30,.72), rgba(16,15,13,.62));
    -webkit-backdrop-filter: blur(18px) saturate(120%);
    backdrop-filter: blur(18px) saturate(120%);
    border: 1px solid rgba(240,165,0,.14);
    border-radius: 22px;
    padding: 24px 26px;
    box-shadow:
      0 18px 50px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,235,200,.10);
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row .card { flex: 1 1 200px; margin: 0; }
  .k { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase;
       color: #8c857a; display: block; margin-bottom: 6px; }
  .v { font: 700 22px/1.1 "Space Mono", ui-monospace, Consolas, monospace; }

  /* Neumorphism, kept but dark: raised by a highlight above and a shadow
     below, in the surface colour rather than in grey. */
  .btn {
    display: inline-block; margin-top: 18px; cursor: pointer;
    font: 600 14px/1 inherit; color: #0a0a0a; background: var(--gold);
    border: 0; border-radius: 999px; padding: 14px 24px;
    box-shadow: 0 8px 20px rgba(240,165,0,.28),
                inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px);
               box-shadow: 0 12px 26px rgba(240,165,0,.36),
                           inset 0 1px 0 rgba(255,255,255,.45); }
  .btn.ghost { background: rgba(255,255,255,.05); color: #f4f1ea;
               box-shadow: inset 0 1px 0 rgba(255,255,255,.10),
                           0 6px 18px rgba(0,0,0,.45); }
  .state { margin-top: 22px; font: 12.5px/1.7 "Space Mono", monospace;
           color: #8c857a; }
  .state b { color: var(--gold); font-weight: 400; }
</style>
</head>
<body>

<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="backdrop-still"></div>
  <div class="backdrop-veil"></div>
</div>

<main class="wrap">
  <h1>Every balance sheet,<br><span class="gold">drawn to scale.</span></h1>
  <p class="lede">A sketch of the dark treatment over the film — enough to check
    that the veil keeps text readable while the clouds move behind it.</p>

  <div class="row">
    <div class="card"><span class="k">Industry standard</span>
      <span class="v" style="color:#8c857a">78.6%</span></div>
    <div class="card"><span class="k">To Scale</span>
      <span class="v gold">99.9%</span></div>
  </div>

  <div class="card" style="margin-top:16px">
    <span class="k">Backdrop state</span>
    <p class="state" id="state">checking…</p>
    <button class="btn" type="button">Get a key</button>
    <button class="btn ghost" type="button">See the drawings</button>
  </div>
</main>

<script src="/static/backdrop.js"></script>
<script>
  // Reports what the loader actually decided, so the preview shows the logic
  // rather than only the result.
  (function () {
    var el = document.getElementById("state");
    function conn() {
      var c = navigator.connection || {};
      return (c.effectiveType || "unknown") + (c.saveData ? " · save-data ON" : "");
    }
    function tick() {
      var v = document.querySelector(".backdrop-film");
      var wide = window.innerWidth >= 901;
      var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.innerHTML =
        "viewport <b>" + window.innerWidth + "px</b> (" +
          (wide ? "desktop" : "mobile — still only") + ")<br>" +
        "reduced motion <b>" + (rm ? "yes — still only" : "no") + "</b><br>" +
        "connection <b>" + conn() + "</b><br>" +
        "film element <b>" + (v ? (v.classList.contains("on")
            ? "playing" : "loading") : "not created") + "</b>";
    }
    tick();
    setInterval(tick, 700);
    addEventListener("resize", tick);
  })();
</script>
</body>
</html>
