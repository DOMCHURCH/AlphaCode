[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# dict(...) literals read better than {...} in test fixtures with many keys.
"tests/*" = ["E402", "C408"]
# dict(color=..., width=...) is plotly's documented idiom for layout kwargs.
"src/report/charts.py" = ["C408"]
