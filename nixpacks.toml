# weasyprint needs cairo/pango/gdk-pixbuf at runtime, and libffi to build.
# Without these the PDF render silently degrades to HTML-only.

[phases.setup]
nixPkgs = [
  "python311",
  "gcc",
  "pkg-config",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "libffi",
  "glib",
  "fontconfig",
  "dejavu_fonts",
]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install --upgrade pip",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
]

[phases.build]
cmds = [". /opt/venv/bin/activate && python -m src.migrate"]

[start]
cmd = "uvicorn src.api:app --host 0.0.0.0 --port $PORT"
